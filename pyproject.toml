[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "blackjack-analysis"
version = "0.1.0"
description = "Simulate blackjack strategies"
requires-python = ">=3.10"
dependencies = ["textual>=0.47"]

[project.optional-dependencies]
web = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
test = ["httpx>=0.27,<1"]

[tool.setuptools.packages.find]
where = ["."]
include = ["blackjack_analysis*"]

[tool.setuptools.package-data]
blackjack_analysis = ["resources/*", "web_static/index.html", "web_static/assets/*"]
